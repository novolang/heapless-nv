[package]
name        = "heapless-nv"
version     = "0.0.4"
description = "WITHDRAWN: the language's Vec[T; N], String[N], Deque[T; N] and Map[K, V; N] (SPEC section 14.8) replace the four fixed-capacity collections this package described.  Published as an interface only; every body is a todo()."
license     = "Apache-2.0"

# WITHDRAWN, and still an INTERFACE release: every `pub fn` body is a
# `todo()`.  `novo pkg publish` recognises the shape and requires both
# the draft stability and the 0.0.x version.  The four stability values
# have none for a withdrawn package, and `draft` promises nothing, so it
# stays.  No 0.1.0 will follow: the language's fixed-capacity family
# (SPEC section 14.8) replaces the package.
stability   = "draft"

# `core`: index arithmetic over buffers the caller owns.  Every function
# is total, from values to values, and none of them reads or writes a
# byte — so there is no effect to declare and the whole surface compiles
# for a device.
layer       = "core"

category    = "embedded"

tags        = ["heapless", "no-alloc", "fixed-capacity", "vec", "fifo", "spsc", "map", "linear-probing", "embedded", "sans-io"]
repository  = "https://github.com/novolang/heapless-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "Withdrawn: the language's fixed-capacity family replaces this package"

[dependencies]
# None.  Bookkeeping over indices needs the language and nothing else,
# which is the property that lets the whole surface link for a Cortex-M.
